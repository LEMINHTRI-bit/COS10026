<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment">
    <meta name="keywords" content="CWA, Help Desk, Appointment">
    <meta name="author" content="Le Minh Tri">
    <title>CWA Help Desk Appointment</title>
</head>

<body>

    <a href="https://www.swin.edu.au">
        <img src="images/logo.png"
             alt="Swinburne University of Technology">
    </a>

    <h1>CWA Help Desk Appointment</h1>

    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>

    <p>Check Blackboard for when CWA tutors will be there.</p>

    <form method="post"
          action="http://mercury.swin.edu.au/it000000/formtest.php">

        <fieldset>
            <legend>Student details</legend>

            <p>
                <label for="studentid">Student ID</label>
                <input type="text"
                       name="studentid"
                       id="studentid"
                       required
                       pattern="[0-9]{7,10}">
            </p>

            <p>
                <label for="givenname">Given Name</label>
                <input type="text"
                       name="givenname"
                       id="givenname"
                       maxlength="15"
                       required
                       pattern="[A-Za-z]+">

                <label for="familyname">Family Name</label>
                <input type="text"
                       name="familyname"
                       id="familyname"
                       maxlength="15"
                       required
                       pattern="[A-Za-z]+">
            </p>
        </fieldset>

        <fieldset>
            <legend>Your unit</legend>

            <p>
                <input type="radio"
                       name="unit"
                       id="cos10011"
                       value="COS10011"
                       required>
                <label for="cos10011">COS10011</label>

                <input type="radio"
                       name="unit"
                       id="cos60004"
                       value="COS60004">
                <label for="cos60004">COS60004</label>

                <input type="radio"
                       name="unit"
                       id="cos60007"
                       value="COS60007">
                <label for="cos60007">COS60007</label>
            </p>

            <p>
                <label for="tutor">Your Tutor</label>

                <select name="tutor" id="tutor" required>
                    <option value="">Please Select</option>
                    <option value="Tutor 1">Tutor 1</option>
                    <option value="Tutor 2">Tutor 2</option>
                    <option value="Tutor 3">Tutor 3</option>
                    <option value="Tutor 4">Tutor 4</option>
                </select>
            </p>
        </fieldset>

        <fieldset>
            <legend>Issue</legend>

            <p>
                <input type="checkbox"
                       name="issue[]"
                       id="html"
                       value="HTML"
                       checked="checked">
                <label for="html">HTML</label>

                <input type="checkbox"
                       name="issue[]"
                       id="css"
                       value="CSS">
                <label for="css">CSS</label>

                <input type="checkbox"
                       name="issue[]"
                       id="javascript"
                       value="JavaScript">
                <label for="javascript">JavaScript</label>

                <input type="checkbox"
                       name="issue[]"
                       id="php"
                       value="PHP">
                <label for="php">PHP</label>

                <input type="checkbox"
                       name="issue[]"
                       id="mysql"
                       value="MySQL">
                <label for="mysql">MySQL</label>
            </p>

            <p>
                <label for="description">Description of Issue</label>
                <br>

                <textarea name="description"
                          id="description"
                          rows="5"
                          cols="30"
                          placeholder="Write description of your problem here..."
                          required></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>

            <p>
                <label for="date">Date</label>
                <input type="text"
                       name="date"
                       id="date"
                       placeholder="dd/mm/yyyy"
                       required
                       pattern="\d{2}/\d{2}/\d{4}">
            </p>

            <p>
                <label for="time">Time</label>
                <input type="text"
                       name="time"
                       id="time"
                       placeholder="00:00"
                       required
                       pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
            </p>
        </fieldset>

        <input type="submit" value="Book">
        <input type="reset" value="Reset form">

    </form>

</body>
</html>
